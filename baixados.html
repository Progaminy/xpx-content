<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XPX</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 20px;
    z-index:999;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.back-btn{
    background:#222;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    font-size:16px;
}

.content{
    padding:100px 20px 40px;
    text-align:center;
}

.title{
    font-size:30px;
    font-weight:bold;
}

.subtitle{
    color:#999;
    margin-top:12px;
}

</style>
</head>

<body>

<div class="header">

    <div class="logo">
        XPX
    </div>

    <button
    class="back-btn"
    onclick="history.back()"
    >
        ← Voltar
    </button>

</div>

<div class="content">

    <div class="title">
        Conteúdo Baixados
    </div>

    <div class="subtitle">
        Conteúdo em breve
    </div>

</div>

</body>
</html>
