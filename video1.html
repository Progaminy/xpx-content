<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>XPX Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: black;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Topo */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 20px;
            z-index: 999;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            background: #222;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
        }

        /* Vídeo fullscreen */
        .video-container {
            width: 100vw;
            height: 100vh;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="logo">
            XPX
        </div>

        <button class="back-btn" onclick="history.back()">
            ← Voltar
        </button>

    </div>

    <div class="video-container">

        <video controls autoplay muted playsinline style="
width:100%;
height:100%;
background:black;
" poster="https://picsum.photos/900/500">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
                type="video/mp4">
        </video>


    </div>

</body>

</html>
