<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XPX</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial,sans-serif;
}

/* Header */
.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:#111;
    border-bottom:1px solid #222;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 20px;
    z-index:999;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.back-btn{
    background:#222;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:12px;
}

/* Conteúdo */
.content{
    padding:100px 18px 30px;
}

/* Card vídeo */
.video-card{
    background:#141414;
    border-radius:18px;
    overflow:hidden;
    margin-bottom:22px;
    border:1px solid #222;
}

.thumb{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#222;
}

.info{
    padding:18px;
}

.title{
    font-size:20px;
    font-weight:bold;
}

.desc{
    color:#aaa;
    margin-top:8px;
    line-height:1.5;
}

.watch-btn{
    width:100%;
    margin-top:18px;
    border:none;
    border-radius:12px;
    padding:16px;
    background:white;
    font-size:18px;
}

</style>
</head>

<body>

<div class="header">

    <div class="logo">
        XPX
    </div>

    <button
    class="back-btn"
    onclick="history.back()"
    >
        ← Voltar
    </button>

</div>

<div class="content">

    <!-- Conteúdo 1 -->
    <div class="video-card">

        <img
        class="thumb"
        src="https://picsum.photos/800/400"
        >

        <div class="info">

            <div class="title">
                Conteúdo XPX 1
            </div>

            <div class="desc">
                Descrição curta do conteúdo.
            </div>

            <button
            class="watch-btn"
            onclick="location.href='#'"
            >
                Assistir
            </button>

        </div>
    </div>

    <!-- Conteúdo 2 -->
    <div class="video-card">

        <img
        class="thumb"
        src="https://picsum.photos/801/400"
        >

        <div class="info">

            <div class="title">
                Conteúdo XPX 2
            </div>

            <div class="desc">
                Outro conteúdo de exemplo.
            </div>

            <button
            class="watch-btn"
            onclick="location.href='#'"
            >
                Assistir
            </button>

        </div>
    </div>

</div>

</body>
</html>
